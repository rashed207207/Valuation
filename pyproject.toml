[project]
name = "equity-research-ai"
version = "0.1.0"
description = "AI-assisted equity research platform combining SEC MD&A RAG with DCF, Monte Carlo, and market-implied expectations."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "yfinance>=0.2.40",
  "scikit-learn>=1.4",
  "streamlit>=1.35",
  "openai>=1.40"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["equity_research_ai*"]
exclude = ["app*", "tests*"]
